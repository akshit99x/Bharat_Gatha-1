name: Game checks

# The game's own tests: content, quiz generators, save loading and the interface languages, with no browser.
# Runs on every push and pull request, so a broken puzzle or an unloadable save is caught before it is merged.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Game checks
        run: npm run check

      - name: Build
        run: npm run build
