name: Python tests

# The optional teacher API (server/) and the tools. The game's own deploy is in deploy.yml.

on:
  push:
    paths: ['server/**', 'tools/**', 'tests/**', 'api/**', 'requirements*.txt', 'pyproject.toml', 'public/teacher/**', 'src/content/**', 'scripts/export-content.mjs', 'scripts/content-export.ts']
  pull_request:
    paths: ['server/**', 'tools/**', 'tests/**', 'api/**', 'requirements*.txt', 'pyproject.toml', 'public/teacher/**', 'src/content/**', 'scripts/export-content.mjs', 'scripts/content-export.ts']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Node lets the drift test re-export the game's content and compare it with server/data/content.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
